<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1224">
  <title>Pasaporte UdeA en vivo</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/jugador.css">
  <link rel="stylesheet" href="/css/juegos.css">
</head>
<body>
  <div id="banner" class="banner" hidden>Sin conexión, reconectando…</div>

  <section id="pantalla-conexion" class="pantalla centro">
    <h1>Pasaporte UdeA</h1>
    <p class="suave">Conectando…</p>
  </section>

  <section id="pantalla-registro" class="pantalla centro" hidden>
    <h1>Pasaporte UdeA</h1>
    <p class="suave">Escribe tu nombre para entrar al juego</p>
    <form id="form-registro" autocomplete="off">
      <label class="oculto-visual" for="nombre">Tu nombre</label>
      <input id="nombre" class="campo" name="nombre" type="text" maxlength="40"
             autocomplete="off" autocapitalize="words" enterkeyhint="go" placeholder="Tu nombre">
      <p id="error-registro" class="error" role="alert"></p>
      <button id="btn-entrar" class="boton" type="submit">Entrar</button>
    </form>
  </section>

  <section id="pantalla-aviso" class="pantalla centro" hidden>
    <h1 id="aviso-titulo"></h1>
    <p id="aviso-texto" class="suave"></p>
  </section>

  <section id="pantalla-principal" class="pantalla principal" hidden>
    <header id="cabecera" class="cabecera"></header>
    <main id="contenido" class="contenido"></main>
    <nav class="pestanas" aria-label="Secciones">
      <button id="tab-jugar" class="tab activa" type="button">Jugar</button>
      <button id="tab-pasaporte" class="tab" type="button">Pasaporte</button>
    </nav>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/jugador.js"></script>
</body>
</html>
